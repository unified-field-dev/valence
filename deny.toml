[advisories]
version = 2
yanked = "warn"
# rsa has no fixed upgrade upstream at all; bincode is transitive via the optional
# surreal backend (surrealmx -> surrealdb-core). Re-check when bumping surrealdb.
# cargo-audit's advisory-db additionally flags atomic-polyfill (RUSTSEC-2023-0089)
# and rkyv (RUSTSEC-2026-0235), both transitive via the same surreal backend stack
# with no safe upgrade yet -- see .cargo/audit.toml. RUSTSEC-2026-0453/0454
# are surrealdb 3.2 advisories on the same stack.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin Attack timing sidechannel; no fixed upgrade available upstream" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; transitive via surrealmx -> surrealdb-core (surreal backend)" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing; transitive via surrealdb-core -> jsonwebtoken -> p256 (surreal backend); fix needs 0.7, blocked until surrealdb moves" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils unmaintained (upstream archived 2026-10-01); transitive via surrealdb -> wasmtimer (surreal backend); no safe upgrade, re-check when bumping surrealdb" },
    { id = "RUSTSEC-2026-0453", reason = "affinitypool spawn_local use-after-free in surrealdb 3.2 KV backends (surreal backend); fix is surrealdb 3.3, which adds quick-xml 0.39 with its own unfixed RUSTSEC-2026-0194/0195, so stay on 3.2 and re-check when bumping surrealdb" },
    { id = "RUSTSEC-2026-0454", reason = "reblessive unsound Send/Sync; transitive via surrealdb-core (surreal backend); fixed only in surrealdb 4.0, re-check when bumping surrealdb" },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.30 via sqlx-sqlite; temporary until the fleet sqlx bump moves it to >=0.39" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "BUSL-1.1",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
