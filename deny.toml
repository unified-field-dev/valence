[advisories]
version = 2
yanked = "warn"
# rsa has no fixed upgrade upstream at all; bincode is transitive via the optional
# surreal backend (surrealmx -> surrealdb-core). Re-check when bumping surrealdb.
# cargo-audit's advisory-db additionally flags atomic-polyfill (RUSTSEC-2023-0089)
# and rkyv (RUSTSEC-2026-0235), both transitive via the same surreal backend stack
# with no safe upgrade yet -- see .cargo/audit.toml.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin Attack timing sidechannel; no fixed upgrade available upstream" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; transitive via surrealmx -> surrealdb-core (surreal backend)" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 timing; transitive via surrealdb-core -> jsonwebtoken -> p256 (surreal backend); fix needs 0.7, blocked until surrealdb moves" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "BUSL-1.1",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
