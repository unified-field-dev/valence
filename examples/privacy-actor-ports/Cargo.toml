[package]
name = "privacy-actor-ports"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Example: SecretProvider / ActorFactory / DatabaseEndpointResolver ports + privacy deny/allow"

[[bin]]
name = "privacy-actor-ports"
path = "src/main.rs"

[dependencies]
valence = { path = "../../valence", features = ["mem"], package = "uf-valence" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
