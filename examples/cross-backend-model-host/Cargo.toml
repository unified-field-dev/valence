[package]
name = "cross-backend-model-host"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false
description = "Example: Project(mem) ↔ Task(sqlite) hop + Model::query"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cross-backend-model-host"
path = "src/main.rs"

[dependencies]
valence = { path = "../../valence", features = ["mem", "sqlite"], package = "uf-valence" }
valence-backend-mem = { workspace = true }
valence-backend-sqlite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[build-dependencies]
valence-codegen = { path = "../../valence-codegen", package = "uf-valence-codegen", version = "0.1.2" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["async-trait", "serde", "serde_json", "valence-backend-mem", "valence-backend-sqlite"]
