[package]
name = "uf-valence-data-use-scan"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Build-time scan of Valence purpose-required call sites into a static data-use snapshot"
documentation = "https://docs.rs/uf-valence-data-use-scan"
keywords = ["orm", "codegen", "data-use", "valence"]
categories = ["development-tools::build-utils"]

[lib]
name = "valence_data_use_scan"

[dependencies]
cargo_metadata = "0.20"
ignore = "0.4"
proc-macro2 = { workspace = true, features = ["span-locations"] }
syn = { workspace = true, features = ["full", "extra-traits", "visit"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
